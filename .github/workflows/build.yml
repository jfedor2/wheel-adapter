name: build
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'r*'
defaults:
  run:
    shell: bash --noprofile --norc -x -e -o pipefail {0}
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install compiler, libraries and tools
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          make
          cd ..
          mkdir build-pico2
          cd build-pico2
          PICO_BOARD=pico2 cmake ..
          make
          cd ..
          mkdir build-feather_rp2040
          cd build-feather_rp2040
          PICO_BOARD=adafruit_feather_rp2040_usb_host cmake ..
          make
          cd ..
          mkdir build-waveshare_rp2350_usb_a
          cd build-waveshare_rp2350_usb_a
          PICO_BOARD=waveshare_rp2350_usb_a cmake ..
          make
          cd ..
          mkdir artifacts
          mv build/adapter.uf2 artifacts/adapter_pico.uf2
          mv build-pico2/adapter.uf2 artifacts/adapter_pico2.uf2
          mv build-feather_rp2040/adapter.uf2 artifacts/adapter_feather_rp2040.uf2
          mv build-waveshare_rp2350_usb_a/adapter.uf2 artifacts/adapter_waveshare_rp2350_usb_a.uf2
      - uses: actions/upload-artifact@v7
        with:
          path: artifacts/*
  create-release:
    if: startsWith(github.ref, 'refs/tags/r')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: download
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" download/*
